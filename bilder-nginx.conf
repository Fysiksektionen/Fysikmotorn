server {
    listen 80;
    server_tokens off;
    autoindex off;

    root /usr/share/nginx/html;

    location ~* ^/bilder/[^/]+\.(png|jpe?g|gif|webp|avif|ico)$ {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        return 404;
    }
}
